[project]
name = "ProteinTalks"
version = "0.1.0"
description = "ProteinTalks perturbation proteomics model, plus separate analysis scripts."
readme = "README.md"
requires-python = ">=3.10.6,<3.11"
dependencies = [
    "torch==1.13.1",
    # The PyPI archive for 1.0.4 omits the package source. This tag is that version.
    "torchdyn @ git+https://github.com/DiffEqML/torchdyn.git@1.0.4",
    "torchdiffeq==0.2.3",
    "numpy==1.24.2",
    "pandas==2.3.1",
    "scikit-learn==1.3.0",
    "matplotlib==3.7.2",
    # lightning_fabric still imports pkg_resources. Setuptools 81+ warns that API is going away.
    "setuptools>=69,<81",
]

[dependency-groups]
dev = [
    "black>=24",
    "gdown>=5.2",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
ProteinTalks = "proteintalks.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/proteintalks", "analysis", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["proteintalks"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = [
    "ignore:pkg_resources is deprecated:UserWarning",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "proteintalks"
module-root = "src"
